project:
  name: "{{project_name}}"
  slug: "{{slug}}"
  stage: "clarification"
  language: "{{language}}"
  last_updated: "{{date}}"

summary:
  raw_idea: "{{raw_idea}}"
  clear_product_description: "{{clear_product_description}}"
  current_verdict: "undecided"
  confirmation:
    confirmation_status: "pending" # Set atomically whenever semantic summary content changes.
    current_revision: 0 # Increment only for semantic summary changes, never for display.
    confirmed_revision: null # Historical last-approved revision; retain while newer content is pending.
    confirmed_at: null # Evidence timestamp for confirmed_revision.
    confirmation_note: null # Approval note for confirmed_revision.
    confirmation_evidence_refs: [] # Evidence for confirmed_revision.

requirements:
  confirmed: []
  hard_constraints: []
  non_goals: []

facts:
  verified: []
  reasoned_inferences: []
  needs_poc: []

decision_tree:
  schema_version: 1
  allowed_kinds:
    - "user_decision"
    - "fact"
    - "assumption"
    - "experiment"
    - "constraint"
  allowed_statuses:
    - "open"
    - "resolved"
    - "assumed"
    - "needs_research"
    - "needs_poc"
    - "deferred"
    - "out_of_scope"
    - "stale"
    - "superseded"
  frontier: []
  nodes:
    - id: "{{node_id}}"
      question: "{{question}}"
      kind: "{{node_kind}}"
      depends_on: []
      status: "{{node_status}}"
      resolution: null
      impact:
        level: "{{high_medium_low}}"
        rationale: "{{impact_rationale}}"
      evidence_refs: []

research:
  source_files:
    - "sources.yaml"
  closest_existing_solutions: []

technical_direction:
  selection_lifecycle: "not-selected"
  recommended_path_id: null
  selected_path_id: null
  recommendation_pending_gate_ids: []
  allowed_selection_lifecycles:
    - "not-selected"
    - "recommended-not-confirmed"
    - "user-confirmed"
  allowed_candidate_provenance:
    - "proposed"
    - "recommended"
    - "user-confirmed"
  candidate_paths:
    - path_id: "{{path_id}}"
      provenance: "{{proposed_recommended_or_user-confirmed}}"
      governing_node_ids: []
      evidence_refs: []
      invalidation_condition: "{{invalidation_condition}}"

stage3:
  schema_version: 1
  state_revision: 0
  handoff_readiness: "not-started"
  allowed_handoff_readiness:
    - "not-started"
    - "blocked"
    - "conditional"
    - "ready-for-planning"
  governing_direction:
    node_id: null
    evidence_refs: []
  ordered_blockers_and_gates:
    - id: "{{gate_id}}"
      exit_condition: "{{exit_condition}}"
      next_action: "{{next_action}}"
      order: 1
      type: "{{summary_confirmation_approval_validation_or_blocker}}"
      status: "{{open_or_cleared}}"
      source_node_id: null
      impact: "{{impact}}"
      affected_path_ids: []
      affected_architecture_element_ids: []
      affected_acceptance_criterion_ids: []
      owner: "{{owner}}"
      evidence_refs: []
  artifact_state_revisions:
    technical_paths: 0
    initial_solution: 0
    ai_handoff: 0

risks: []
open_questions: [] # Derived from active open decision-tree nodes.
decisions: [] # Legacy summary; decision_tree is authoritative.

artifacts:
  product_definition: "01-product-definition.md"
  research_dossier: null
  feasibility_report: null
  technical_paths: null
  initial_solution: null
  ai_handoff: null

